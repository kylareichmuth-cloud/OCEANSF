name: Ocean SF Daily Lead Agent

on:
  schedule:
    # 14:00 UTC = 7:00am Pacific (adjust for daylight saving as needed)
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py

      - name: Commit updated lead log
        run: |
          git config user.name "ocean-sf-lead-agent"
          git config user.email "actions@github.com"
          git add leads_log.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add daily lead $(date +'%Y-%m-%d')"
          git push
